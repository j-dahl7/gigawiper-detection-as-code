name: Deploy Content to sentinel-federation-eus2-law [6a904228-d073-42c3-9871-19e65101b968]
# Note: This workflow will deploy everything in the root directory.
# To deploy content only from a specific path (for example SentinelContent):
#   1. Add the target path to the "paths" property like such
#    paths:
#    - 'SentinelContent/**'
#    - '!.github/workflows/**'
#    - '.github/workflows/sentinel-deploy-6a904228-d073-42c3-9871-19e65101b968.yml'
#   2. Append the path to the directory environment variable below
#       directory: '${{ github.workspace }}/SentinelContent'

on:
  push:
    branches: [ native-repository-canary-20260713 ]
    paths:
    - '**'
    - '!.github/workflows/**'  # this filter prevents other workflow changes from triggering this workflow
    - '.github/workflows/sentinel-deploy-6a904228-d073-42c3-9871-19e65101b968.yml'

jobs:
  deploy-content:
    runs-on: windows-latest
    env:
      resourceGroupName: 'sentinel-federation-eus2-rg'
      workspaceName: 'sentinel-federation-eus2-law'
      workspaceId: '15a428f5-b0af-42ab-bc30-ef1b2fc6d601'
      directory: '${{ github.workspace }}'
      cloudEnv: 'AzureCloud'
      contentTypes: 'CustomDetection'
      branch: 'native-repository-canary-20260713'
      sourceControlId: '6a904228-d073-42c3-9871-19e65101b968'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'
    permissions:
      contents: write
      id-token: write # Require write permission to Fetch an OIDC token.

    steps:
    - name: Login to Azure (Attempt 1)
      continue-on-error: true
      id: login1
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_6a904228d07342c3987119e65101b968 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_6a904228d07342c3987119e65101b968 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_6a904228d07342c3987119e65101b968 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 1 failed
      if: ${{ steps.login1.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 2)
      continue-on-error: true
      id: login2
      uses: azure/login@v2
      if: ${{ steps.login1.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_6a904228d07342c3987119e65101b968 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_6a904228d07342c3987119e65101b968 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_6a904228d07342c3987119e65101b968 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 2 failed
      if: ${{ steps.login2.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 3)
      continue-on-error: false
      id: login3
      uses: azure/login@v2
      if: ${{ steps.login2.outcome=='failure'  }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_6a904228d07342c3987119e65101b968 }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_6a904228d07342c3987119e65101b968 }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_6a904228d07342c3987119e65101b968 }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy Content to Microsoft Sentinel
      uses: azure/powershell@v2
      with:
        azPSVersion: 'latest'
        inlineScript: |
          ${{ github.workspace }}//.github/workflows/azure-sentinel-deploy-6a904228-d073-42c3-9871-19e65101b968.ps1