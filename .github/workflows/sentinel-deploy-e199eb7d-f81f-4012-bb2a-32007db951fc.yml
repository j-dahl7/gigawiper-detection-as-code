name: Deploy Content to sentinel-urbac-lab-law [e199eb7d-f81f-4012-bb2a-32007db951fc]
# Note: This workflow will deploy everything in the root directory.
# To deploy content only from a specific path (for example SentinelContent):
#   1. Add the target path to the "paths" property like such
#    paths:
#    - 'SentinelContent/**'
#    - '!.github/workflows/**'
#    - '.github/workflows/sentinel-deploy-e199eb7d-f81f-4012-bb2a-32007db951fc.yml'
#   2. Append the path to the directory environment variable below
#       directory: '${{ github.workspace }}/SentinelContent'

on:
  push:
    branches: [ main ]
    paths:
    - '**'
    - '!.github/workflows/**'  # this filter prevents other workflow changes from triggering this workflow
    - '.github/workflows/sentinel-deploy-e199eb7d-f81f-4012-bb2a-32007db951fc.yml'

jobs:
  deploy-content:
    runs-on: windows-latest
    env:
      resourceGroupName: 'sentinel-urbac-lab-rg'
      workspaceName: 'sentinel-urbac-lab-law'
      workspaceId: '26c21d45-f8a7-4fae-884c-3e6090f38862'
      directory: '${{ github.workspace }}'
      cloudEnv: 'AzureCloud'
      contentTypes: 'CustomDetection'
      branch: 'main'
      sourceControlId: 'e199eb7d-f81f-4012-bb2a-32007db951fc'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'
    permissions:
      contents: write
      id-token: write # Require write permission to Fetch an OIDC token.

    steps:
    - name: Login to Azure (Attempt 1)
      continue-on-error: true
      id: login1
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_e199eb7df81f4012bb2a32007db951fc }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_e199eb7df81f4012bb2a32007db951fc }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_e199eb7df81f4012bb2a32007db951fc }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 1 failed
      if: ${{ steps.login1.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 2)
      continue-on-error: true
      id: login2
      uses: azure/login@v2
      if: ${{ steps.login1.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_e199eb7df81f4012bb2a32007db951fc }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_e199eb7df81f4012bb2a32007db951fc }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_e199eb7df81f4012bb2a32007db951fc }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 2 failed
      if: ${{ steps.login2.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 3)
      continue-on-error: false
      id: login3
      uses: azure/login@v2
      if: ${{ steps.login2.outcome=='failure'  }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_e199eb7df81f4012bb2a32007db951fc }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_e199eb7df81f4012bb2a32007db951fc }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_e199eb7df81f4012bb2a32007db951fc }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Checkout
      uses: actions/checkout@v3

    - name: Deploy Content to Microsoft Sentinel
      uses: azure/powershell@v2
      with:
        azPSVersion: 'latest'
        inlineScript: |
          ${{ github.workspace }}//.github/workflows/azure-sentinel-deploy-e199eb7d-f81f-4012-bb2a-32007db951fc.ps1