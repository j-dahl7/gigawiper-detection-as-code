name: Deploy Content to sentinel-federation-eus2-law [51af5a44-e148-40f0-b250-6457efb89a6c]
# Note: This workflow will deploy everything in the root directory.
# To deploy content only from a specific path (for example SentinelContent):
#   1. Add the target path to the "paths" property like such
#    paths:
#    - 'SentinelContent/**'
#    - '!.github/workflows/**'
#    - '.github/workflows/sentinel-deploy-51af5a44-e148-40f0-b250-6457efb89a6c.yml'
#   2. Append the path to the directory environment variable below
#       directory: '${{ github.workspace }}/SentinelContent'

# Safety override for the generated workflow: native Repository synchronization
# failed during this lab and the six stable IDs are currently managed through a
# separately authorized Graph fallback. Keep the native retry manual until
# ownership is deliberately transferred back to the Repository connection.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_NATIVE_SENTINEL_CONTENT to authorize a native retry'
        required: true
        type: string

# This exact group is also used by graph-preview-fallback.yml. GitHub therefore
# permits only one native-or-Graph writer to execute at a time.
concurrency:
  group: nls-gigawiper-custom-detection-writer
  cancel-in-progress: false

jobs:
  deploy-content:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_NATIVE_SENTINEL_CONTENT' }}
    runs-on: windows-latest
    env:
      resourceGroupName: 'sentinel-federation-eus2-rg'
      workspaceName: 'sentinel-federation-eus2-law'
      workspaceId: '15a428f5-b0af-42ab-bc30-ef1b2fc6d601'
      directory: '${{ github.workspace }}'
      cloudEnv: 'AzureCloud'
      contentTypes: 'CustomDetection'
      branch: 'main'
      sourceControlId: '51af5a44-e148-40f0-b250-6457efb89a6c'
      rootDirectory: '${{ github.workspace }}'
      githubAuthToken: ${{ secrets.GITHUB_TOKEN }}
      smartDeployment: 'true'
    permissions:
      contents: write
      id-token: write # Require write permission to Fetch an OIDC token.

    steps:
    - name: Login to Azure (Attempt 1)
      continue-on-error: true
      id: login1
      uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_51af5a44e14840f0b2506457efb89a6c }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_51af5a44e14840f0b2506457efb89a6c }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_51af5a44e14840f0b2506457efb89a6c }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 1 failed
      if: ${{ steps.login1.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 2)
      continue-on-error: true
      id: login2
      uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
      if: ${{ steps.login1.outcome=='failure' }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_51af5a44e14840f0b2506457efb89a6c }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_51af5a44e14840f0b2506457efb89a6c }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_51af5a44e14840f0b2506457efb89a6c }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Wait 30 seconds if login attempt 2 failed
      if: ${{ steps.login2.outcome=='failure' }}
      run: powershell Start-Sleep -s 30

    - name: Login to Azure (Attempt 3)
      continue-on-error: false
      id: login3
      uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
      if: ${{ steps.login2.outcome=='failure'  }}
      with:
        client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_51af5a44e14840f0b2506457efb89a6c }}
        tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_51af5a44e14840f0b2506457efb89a6c }}
        subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_51af5a44e14840f0b2506457efb89a6c }}
        environment: 'AzureCloud'
        audience: api://AzureADTokenExchange
        enable-AzPSSession: true

    - name: Checkout
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

    - name: Install pinned Bicep CLI
      shell: pwsh
      run: az bicep install --version v0.45.6

    - name: Deploy Content to Microsoft Sentinel
      uses: azure/powershell@6101bc5f8a23168669e44f7e68db621ec5ecbc6e # v2
      with:
        azPSVersion: '16.1.0'
        inlineScript: |
          ${{ github.workspace }}//.github/workflows/azure-sentinel-deploy-51af5a44-e148-40f0-b250-6457efb89a6c.ps1
