name: Debug custom detection app authorization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/debug-custom-detection-auth.yml

permissions:
  contents: read
  id-token: write

jobs:
  inspect-authorization:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Sign in with the Repository connection identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_SENTINEL_CLIENTID_51af5a44e14840f0b2506457efb89a6c }}
          tenant-id: ${{ secrets.AZURE_SENTINEL_TENANTID_51af5a44e14840f0b2506457efb89a6c }}
          subscription-id: ${{ secrets.AZURE_SENTINEL_SUBSCRIPTIONID_51af5a44e14840f0b2506457efb89a6c }}

      - name: Inspect token-safe Graph authorization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $graphToken = az account get-access-token --resource-type ms-graph --query accessToken -o tsv
          if (-not $graphToken) {
            throw 'Microsoft Graph token acquisition returned no token.'
          }

          $payload = $graphToken.Split('.')[1].Replace('-', '+').Replace('_', '/')
          switch ($payload.Length % 4) {
            2 { $payload += '==' }
            3 { $payload += '=' }
          }
          $claims = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload)) | ConvertFrom-Json
          [pscustomobject]@{
            audience = $claims.aud
            appId = $claims.appid
            objectId = $claims.oid
            roles = @($claims.roles)
          } | ConvertTo-Json -Depth 5

          $responsePath = Join-Path $env:RUNNER_TEMP 'custom-detections-response.json'
          $status = curl.exe -4 -sS -o $responsePath -w '%{http_code}' `
            -H "Authorization: Bearer $graphToken" `
            'https://graph.microsoft.com/beta/security/rules/detectionRules?$top=1'
          $response = Get-Content -Raw $responsePath | ConvertFrom-Json

          if ($status -eq '200') {
            Write-Host "Graph list status: $status"
            Write-Host "Returned item count: $(@($response.value).Count)"
          }
          else {
            [pscustomobject]@{
              graphStatus = $status
              errorCode = $response.error.code
              errorMessage = $response.error.message
              requestId = $response.error.innerError.'request-id'
            } | ConvertTo-Json -Depth 5
            throw "Graph custom detection authorization failed with HTTP $status."
          }

      - name: Reproduce provider validation
        shell: pwsh
        continue-on-error: true
        run: |
          az bicep install --version v0.45.6
          az deployment group validate `
            --resource-group sentinel-federation-eus2-rg `
            --template-file detections/NLS-GW-000-canary.bicep `
            --name debug-custom-detection-auth `
            --only-show-errors `
            -o json

      - name: Bootstrap the disabled canary through Graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $graphToken = az account get-access-token --resource-type ms-graph --query accessToken -o tsv
          if (-not $graphToken) {
            throw 'Microsoft Graph token acquisition returned no token.'
          }

          $body = @{
            '@odata.type' = '#microsoft.graph.security.detectionRule'
            id = 'nls-gw-000-canary'
            displayName = 'NLS-GW-000 - Detection as Code Canary'
            description = 'Disabled deployment canary for the Nine Lives detection-as-code lab.'
            status = 'disabled'
            queryCondition = @{
              queryText = 'DeviceProcessEvents | where FileName =~ "nls-gigawiper-canary.exe" | project Timestamp, DeviceId, ReportId, DeviceName, FileName, FolderPath, ProcessCommandLine'
            }
            schedule = @{
              frequency = 'PT1H'
            }
            detectionAction = @{
              alertTemplate = @{
                title = 'NLS canary process observed on {{DeviceName}}'
                description = 'Disabled deployment canary for the Nine Lives detection-as-code lab. It has no automated response action.'
                severity = 'low'
                tactics = @(
                  @{
                    tactic = 'Execution'
                    techniques = @(
                      @{ technique = 'T1059' }
                    )
                  }
                )
                entityMappings = @{
                  hosts = @(
                    @{ deviceIdColumn = 'DeviceId' }
                  )
                }
              }
            }
          } | ConvertTo-Json -Depth 20 -Compress

          $responsePath = Join-Path $env:RUNNER_TEMP 'canary-create-response.json'
          $status = $body | curl.exe -4 -sS -o $responsePath -w '%{http_code}' `
            -X POST `
            -H "Authorization: Bearer $graphToken" `
            -H 'Content-Type: application/json' `
            --data-binary '@-' `
            'https://graph.microsoft.com/beta/security/rules/detectionRules'
          $response = Get-Content -Raw $responsePath | ConvertFrom-Json

          if ($status -eq '201') {
            [pscustomobject]@{
              graphStatus = $status
              id = $response.id
              displayName = $response.displayName
              status = $response.status
            } | ConvertTo-Json
          }
          elseif ($status -eq '409') {
            [pscustomobject]@{
              graphStatus = $status
              errorCode = $response.error.code
              errorMessage = $response.error.message
              requestId = $response.error.innerError.'request-id'
            } | ConvertTo-Json -Depth 5

            $getPath = Join-Path $env:RUNNER_TEMP 'canary-get-response.json'
            $getStatus = curl.exe -4 -sS -o $getPath -w '%{http_code}' `
              -H "Authorization: Bearer $graphToken" `
              'https://graph.microsoft.com/beta/security/rules/detectionRules/nls-gw-000-canary'
            $getResponse = Get-Content -Raw $getPath | ConvertFrom-Json
            [pscustomobject]@{
              getStatus = $getStatus
              id = $getResponse.id
              displayName = $getResponse.displayName
              status = $getResponse.status
              errorCode = $getResponse.error.code
              errorMessage = $getResponse.error.message
            } | ConvertTo-Json -Depth 5
          }
          else {
            [pscustomobject]@{
              graphStatus = $status
              errorCode = $response.error.code
              errorMessage = $response.error.message
              requestId = $response.error.innerError.'request-id'
            } | ConvertTo-Json -Depth 5
            throw "Graph canary creation failed with HTTP $status."
          }
