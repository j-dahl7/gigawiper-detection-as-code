name: Deploy custom detections - preview fallback

# Public reuse requires a dedicated Entra application, federated credential,
# protected GitHub environment, and variables owned by the operator's tenant.
# This repository supplies no reusable tenant authorization. Apply mutates the
# exact custom-detection IDs in that configured tenant; Inspect is read-only.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read scheduler metadata or apply the preview fallback
        required: true
        type: choice
        options:
          - Inspect
          - Apply
        default: Inspect
      scope:
        description: Rules to inspect or apply
        required: true
        type: choice
        options:
          - Canary
          - All
        default: Canary
      confirmation:
        description: Type INSPECT_PREVIEW_FALLBACK or DEPLOY_PREVIEW_FALLBACK
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AZURE_CORE_OUTPUT: none

concurrency:
  # This is the repository's only active custom-detection writer. Keep the
  # stable lock name so any separately reviewed, freshly generated native
  # workflow can be hardened to serialize with it before a future ownership
  # transition.
  group: nls-gigawiper-custom-detection-writer
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          ((inputs.operation == 'Inspect' && inputs.confirmation == 'INSPECT_PREVIEW_FALLBACK') ||
           (inputs.operation == 'Apply' && inputs.confirmation == 'DEPLOY_PREVIEW_FALLBACK')) }}
    runs-on: windows-latest
    environment: custom-detection-fallback
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Sign in with the Graph-only fallback identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.CUSTOM_DETECTION_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Install the validated Bicep CLI
        if: ${{ inputs.operation == 'Apply' }}
        shell: pwsh
        run: az bicep install --version v0.45.6

      - name: Inspect or apply custom detections
        shell: pwsh
        env:
          RUN_MODE: ${{ inputs.operation }}
          DEPLOY_SCOPE: ${{ inputs.scope }}
        run: |
          $ErrorActionPreference = 'Stop'
          $token = az account get-access-token --resource-type ms-graph --query accessToken -o tsv 2>$null
          if (-not $token) {
            throw 'Microsoft Graph token acquisition returned no token.'
          }
          Write-Output "::add-mask::$token"
          try {
            $env:GRAPH_ACCESS_TOKEN = $token
            ./scripts/Deploy-CustomDetectionsGraph.ps1 -Mode $env:RUN_MODE -Scope $env:DEPLOY_SCOPE
          }
          finally {
            Remove-Item Env:GRAPH_ACCESS_TOKEN -ErrorAction SilentlyContinue
            $token = $null
          }
